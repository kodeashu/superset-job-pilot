name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Netlify Edge/Serverless Functions syntax
        run: |
          for f in netlify/functions/*.mjs; do
            node --check "$f"
          done

      - name: Verify netlify_dist frontend build is in sync
        env:
          SJP_BUILD_ONLY: "1"
        run: |
          python scripts/build_frontend.py
          python scripts/build_frontend.py --check

      - name: Run unit tests
        env:
          SJP_BUILD_ONLY: "1"
        run: python -m unittest discover -s tests -v

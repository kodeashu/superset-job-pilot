# Fly.io 24/7 Docker Deployment Config for Superset Job Pilot
# Deploy steps:
#   1. fly launch --no-deploy --copy-config
#   2. fly volumes create superset_data --size 1 --region bom
#   3. fly secrets set APP_SECRET_KEY="$(openssl rand -base64 36)" SUPERSET_EMAIL="..." SUPERSET_PASSWORD="..."
#   4. fly deploy
app = "superset-job-pilot"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/app/data"
  WA_AUTH_DIR = "/app/data/wa_auth"
  ENABLE_WHATSAPP_BRIDGE = "true"
  POLL_INTERVAL_MINUTES = "15"

[[mounts]]
  source = "superset_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "25s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

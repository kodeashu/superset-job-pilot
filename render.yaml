services:
  - type: web
    name: superset-job-pilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: WA_AUTH_DIR
        value: /app/data/wa_auth
      - key: ENABLE_WHATSAPP_BRIDGE
        value: "true"
      - key: AI_PROVIDER
        value: heuristic
      - key: ENABLE_OLLAMA
        value: "false"

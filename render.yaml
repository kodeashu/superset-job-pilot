services:
  - type: web
    name: superset-job-pilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - .github/**
        - README.md
        - LOCAL_SETUP_AND_HANDOVER.md
        - tests/**
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: WA_AUTH_DIR
        value: /app/data/wa_auth
      - key: ENABLE_WHATSAPP_BRIDGE
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=160"
      - key: GUNICORN_THREADS
        value: "4"
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: AUTO_APPLY_ELIGIBLE
        value: "false"
      - key: AI_PROVIDER
        value: heuristic
      - key: ENABLE_OLLAMA
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SUPERSET_EMAIL
        sync: false
      - key: SUPERSET_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
